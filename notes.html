<!doctype html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Speaker notes · PIP AI Growth Engine</title>
<style>
@font-face { font-family: "Jakarta"; src: url("assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
:root { --pink:#D6007A; --rose:#F4A3CB; --teal:#1B7F8C; --bg:#14060f; --card:#22101c; --ink:#fff5fa; --muted:#c9b3c0; --fs:21px; }
body.light { --bg:#fdf3f8; --card:#ffffff; --ink:#2b2b2b; --muted:#6d6168; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Jakarta", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; border-bottom: 1px solid rgba(214,0,122,.35); }
.row { display: flex; gap: 8px; align-items: center; }
.timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 24px; min-width: 64px; }
header .row button { flex: none; } header .row { flex-wrap: nowrap; }
.timer.warn { color: #ffb54d; } .timer.over { color: #ff5c9b; }
.target { font-size: 12px; color: var(--muted); line-height: 1.2; }
button { font: inherit; border: 0; border-radius: 10px; background: #3a1730; color: #fff; padding: 9px 10px; font-weight: 700; font-size: 14px; }
body.light button { background: #f3dbe7; color: #2b2b2b; }
button.on, button.pink { background: var(--pink) !important; color: #fff !important; }
.sp { flex: 1; }
.who { display: flex; gap: 6px; overflow-x: auto; padding-top: 8px; scrollbar-width: none; }
.who::-webkit-scrollbar { display: none; }
.who button { white-space: nowrap; padding: 7px 12px; font-size: 13px; }
main { padding: 10px 12px calc(env(safe-area-inset-bottom) + 90px); }
.sec { margin: 18px 2px 8px; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--rose); display: flex; justify-content: space-between; }
body.light .sec { color: var(--pink); }
.card { background: var(--card); border-radius: 16px; padding: 14px 16px 16px; margin: 0 0 12px; border-left: 5px solid var(--pink); scroll-margin-top: 120px; }
.card.cur { outline: 2px solid var(--rose); }
.ch { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.ch b { font-size: 16px; } .ch span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.say { font-size: var(--fs); line-height: 1.5; }
.say strong { color: #ff8cc4; } body.light .say strong { color: var(--pink); }
.say p { margin: 0 0 .55em; }
.clk { display: inline-block; background: var(--pink); color: #fff; font-size: .62em; font-weight: 800; letter-spacing: .06em; padding: 2px 8px; border-radius: 6px; vertical-align: .2em; margin: 0 3px; }
.dir { font-size: 14px; color: var(--muted); font-style: italic; margin: 6px 0; }
.pause { color: var(--rose); font-weight: 800; padding: 0 2px; }
.never { font-size: 14px; color: var(--muted); }
.qa td { padding: 8px 6px; vertical-align: top; border-top: 1px solid rgba(255,255,255,.08); font-size: 15px; line-height: 1.4; }
.qa td:first-child { font-weight: 700; width: 38%; }
.qa .own { display: block; color: var(--rose); font-size: 12px; font-weight: 800; margin-top: 3px; }
footer { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px); background: linear-gradient(transparent, var(--bg) 30%); }
footer button { flex: 1; padding: 14px; font-size: 17px; }
@media print {
  @page { size: 90mm 160mm; margin: 6mm; }
  header, footer { display: none; } main { padding: 0; } body { background: #fff; color: #222; --fs: 16px; --muted:#666; --card:#fff; }
  .card { break-inside: avoid; border: 1px solid #eee; border-left: 4px solid var(--pink); } .say strong { color: var(--pink); }
}
</style>
</head>
<body>
<header>
  <div class="row">
    <div><div class="timer" id="t">0:00</div><div class="target" id="tg">target 9:00</div></div>
    <button class="pink" id="start">Start</button>
    <button id="reset">Reset</button>
    <span class="sp"></span>
    <button id="fm" aria-label="Smaller text">A−</button>
    <button id="fp" aria-label="Larger text">A+</button>
    <button id="theme" aria-label="Light or dark">◐</button>
  </div>
  <div class="who" id="who"></div>
</header>
<main id="m"></main>
<footer><button id="prev">◀ Prev</button><button class="pink" id="next">Next slide ▶</button></footer>

<script>
/* Script text = "Group 01 Presentation Script — PIP AI Growth Engine (10 min)". ** ** = stress, [>] = click, / = pause, {{ }} = stage direction */
const S = [
 {sp:"Wee Khee", n:1, t:"Introduction", at:"0:00–0:12", say:"Good afternoon, Prof Lim and fellow MBAI Leaders! We are Group 01 and we are honoured to be the 1st group to kick start our OPIM Group presentation the Strategic Business Plan for our company of choice - Pink in Public. We call this the PIP AI Growth Engine! [>]"},
 {sp:"Wee Khee", n:2, t:"Singapore’s 1st Smart Retail Network", at:"0:12–0:40", say:"Pink in Public is Singapore’s first smart retail network: mini-shops with **no shopkeeper**, each with a screen on top. Four machine types, seven SmartMarts, and **five sides** on one platform. Shoppers buy in their own lobby. Advertisers rent the screen. Suppliers consign the stock. Landlords host the machine rent-free for a 10% share. Co-owners fund it. / It is a multi-sided marketplace — the Chapter 8 platform, standing in a lobby. [>] {{Point at the five icons as you name them.}}"},
 {sp:"Wee Khee", n:3, t:"Growth Loop", at:"0:40–1:02", say:"It grows as a loop. Four hundred co-owners pay S$13,000 a machine for S$300 a month. That funds **300-plus sites**, which bring shoppers, which attract **200 advertisers** and **27 suppliers** — whose revenue attracts more co-owners. / Revenue fuels growth. But only if every turn of the loop **pays**. [>] {{Trace the ring clockwise, 1 to 5.}}"},
 {sp:"Wee Khee", n:4, t:"6 Core Processes (today)", at:"1:02–1:20", say:"Today that loop runs by hand. Of six core processes, **five are manual**: screens sold by bespoke pitch, refills in about three days, sites signed in six to eight weeks, results reported by screenshot, partners paid twice a year. Only ad scheduling is automated. [>]"},
 {sp:"Wee Khee", n:5, t:"Problem: 3 Pillars + Ferlyn’s clip", at:"1:20–2:00", say:"Here is the founder, Ferlyn. [>] {{The click PLAYS the clip (0:18). Step aside, don’t talk over it. When it ends:}} Her three pillars are under strain. Advertisers: only **60%** of screen-months sold — so a screen earns S$210 against the S$300 promised, a coverage ratio of **0.70**. Suppliers: **27** of the hundred she wants. Landlords: **17%** of sites flagged to move. / Growing the fleet without proof only grows that gap. [>]"},
 {sp:"Wee Khee", n:6, t:"Our Proposal", at:"2:00–2:30", say:"Our answer is the PIP AI Growth Engine: **proof from the till**. Built like **Airbnb** for landlords and co-owners. Funded like **Google** for advertisers. Run like **Amazon** for suppliers. One AI model keeps all three promises with four jobs: **Match, Plan, Prove, Learn**. The model writes the list; a named person signs it. / Rizwan starts where every machine starts — the site. {{Hand the clicker to Rizwan.}}"},
 {sp:"Rizwan", n:7, t:"Landlord Engine: Build like Airbnb", at:"2:30–3:00", say:"{{Airbnb card is already on screen. Click first, then speak.}} Airbnb owns no rooms. Yet hosts list anyway. / Why? Because Airbnb brings the guests — and shows each host what their room earns. [>] Pink in Public is built the same way: landlords give the space, co-owners fund the machines, PIP brings the shoppers. But today a new site comes by **referral and chance**, signing takes **six to eight weeks**, and **17%** of our sites sit in the wrong place. [>] We fix that with two words. **Match.** / And **prove.** [>] {{“Prove” lands one second after “Match”.}}"},
 {sp:"Rizwan", n:8, t:"Landlord Engine: MATCH", at:"3:00–3:30", say:"Before a landlord signs anything, the AI scores the address — from what our **300 sites** already sell, plus open data: residents within 400 metres, offices, MRT traffic, and who else sells nearby. [>] One day later: a two-page proposal with the landlord’s 10%, **in dollars**. [>] And one rule: if the machine cannot pay the rent **twice over**, we do not sign. [>] One bad lease in five — avoided. [>]"},
 {sp:"Rizwan", n:9, t:"Landlord Engine: PROVE", at:"3:30–4:00", say:"After signing, every landlord gets a monthly scorecard: what the lobby sold, who bought, and their 10%, paid. [>] Every machine gets a decision — fix first, move second — and a person signs every move: **at most 2%** of the fleet a year, against 17% today. [>] Co-owners see the real income of every machine they funded. [>] We start with **20 pilot sites**. Good sites say yes in three to four weeks — / not eight. Sanesh: the screens. {{Say “not eight” as the tile lands. Pass the clicker.}}"},
 {sp:"Sanesh", n:10, t:"Advertiser Engine: Funded like Google", at:"4:00–4:30", say:"{{Slides animate on their own: one click per slide.}} Landlords give PIP the space. Advertisers pay for it. / Google is free for the people searching, yet advertisers pay — because Google reaches people who are looking, and **proves** what happened next. PIP is the same: free for the shopper, paid for by brands on **500 screens** — 70% of our revenue. But today we sell those screens with a pitch. Only **60%** are sold, a screen earns S$210 of the S$300 promised, and **half the brands never come back**. Our fix: Match, and Prove. [>]"},
 {sp:"Sanesh", n:11, t:"Advertiser Engine: MATCH", at:"4:30–5:00", say:"Match happens before a brand books. The AI scores every screen from what its shoppers actually buy, **by the hour** — 50,000 purchases a month. A sports-drink brand gets the screens that sell the most drinks after 6 pm, near gyms and offices. It books from a catalogue with an instant quote. A proposal drops from **four hours to fifteen minutes**; one salesperson handles **150** accounts, not 60; and screen-time sold rises from 60% to **70% by 2028**. [>]"},
 {sp:"Sanesh", n:12, t:"Advertiser Engine: PROVE", at:"5:00–5:30", say:"Prove happens after the ad plays. Because the screen sits on a till, every purchase is a real person at that screen, at that minute. / **No lobby panel can count that. Our till can.** Then the response: a scan, a coupon, a sale — and sales compared with twin screens that did not show the ad. Brands that see proof come back: repeat buyers rise from 50% to **65%**, and coverage of the co-owner promise from 0.70 to **0.88** by 2028. Kartik: what goes on the shelf. {{Pass the clicker.}}"},
 {sp:"Kartik", n:13, t:"Supplier Engine: Run like Amazon", at:"5:30–6:00", say:"{{Amazon card is already on screen. Click first, then speak.}} Amazon has no shopkeeper. A model forecasts what each warehouse sells, places the stock, and reorders before it runs out. [>] Pink in Public has no shopkeeper either: **670 machines**, and suppliers consign the stock — they own it until it sells. But today a supplier ships **on a guess**: 27 suppliers against 100, the same 25 products everywhere, and a refill takes three days. [>] We fix that with two words. **Match.** / And **plan.** [>]"},
 {sp:"Kartik", n:14, t:"Supplier Engine: MATCH", at:"6:00–6:30", say:"Before a supplier ships a single unit, the AI reads **50,000 purchases a month** and ranks who to approach. [>] Then it places the product: machines that behave alike are twins, so a protein bar goes to **20 office towers at 3 pm** — not condominiums — with 1,840 units expected. [>] We test it: a four-week Launchpad, 20 machines, **S$1,500**. [>] One gate: expand only if those machines run **5% ahead** of their twins. / Real sales decide, not a pitch. [>]"},
 {sp:"Kartik", n:15, t:"Supplier Engine: PLAN", at:"6:30–7:00", say:"Then we keep the shelf full. One forecast per product per machine sets the facings and the trips. [>] The model calls the refill **before** the shelf empties: three days becomes under one. [>] And PIP’s share is set per machine — lower to prove a new product, higher for a prime facing. That is **Lim, Wang and Wu’s** consignment contract, run on 670 machines. [>] Suppliers grow from 27 to 66 by 2028 and 110 by 2031, each selling **12% more**. / Josephine: what it is worth. {{Look at Prof Lim on “Lim, Wang and Wu”. Pass the clicker.}}"},
 {sp:"Josephine", n:16, t:"Size of the Benefit", at:"7:00–7:30", say:"{{Let the bars grow, then speak. Point at each number.}} Here is what it is worth. The grey bars are Ferlyn’s own targets, reproduced within 4%. The pink bars are our plan. Revenue goes from S$1.8 million today to **S$5.4 million in 2028** — three times — and **S$11.2 million by 2031**: S$4.5 million a year above her own plan. / And the number co-owners care about: coverage of their S$300 promise rises from 0.70 to **above 1.0 in 2030** — the screens finally pay what was promised. [>]"},
 {sp:"Josephine", n:17, t:"Cost, payback, what if we are wrong", at:"7:30–8:00", say:"The cost: **S$4.25 million** over five years — and the biggest item is people, not technology. 2027 is the investment year: minus S$0.23 million. **Payback comes in 2028**, and S$7.2 million of profit by 2031. / And if we are wrong? Even our late-proof case still makes **S$1.5 million in 2031**. We run 90-day pilots and only scale what works. Wee Khee: how we roll it out. {{Gesture across the three scenario cards. Pass the clicker.}}"},
 {sp:"Wee Khee", n:18, t:"AI-Enhanced Processes", at:"8:00–8:15", say:"{{Slow down: the last minute is what Prof Lim remembers.}} Remember the five manual processes? Here they are again — each now run by Match, Plan, Prove or Learn. And in **every one**, the AI writes the list and a **person signs it**. [>]"},
 {sp:"Wee Khee", n:19, t:"Execution", at:"8:15–8:35", say:"We start small. A **90-day pilot** in Q1 2027, inside the 2027 budget, with clear go / no-go gates that Ferlyn decides. Then rules first in 2027, learned models in 2028, and **2,500 machines** by 2031. [>]"},
 {sp:"Wee Khee", n:20, t:"Built like Airbnb · Funded like Google · Run like Amazon", at:"8:35–8:52", say:"So: partners own it. Screens pay for it. Every purchase teaches it what to stock, what to show and where to grow. / PIP does not only need more screens. **It needs one brain.** [>]"},
 {sp:"Wee Khee", n:21, t:"One Brain across the course", at:"8:52–8:58", say:"And that brain is Chapter 3 — analytics and AI — joining every topic of this course. [>]"},
 {sp:"Wee Khee", n:22, t:"Q&A", at:"8:58–9:00", say:"Thank you. We welcome your questions. {{All five step forward. Wee Khee repeats each question in one line, then names the owner.}}"},
];
const QA = [
 ["Why is PIP an online business?","Wee Khee","It is a multi-sided platform: brands book screens online, suppliers and co-owners see results online, and every till streams sales data. The shop is physical; the business runs on data."],
 ["Your share varies by machine, but Lim, Wang and Wu find one common share is optimal. Why?","Kartik","The paper’s retailer is one capacitated store. PIP is 670 capacitated stores with different demand, so we apply the logic per machine — and keep its other finding: share-only consignment, no slot fee."],
 ["How sure are the revenue numbers?","Josephine","Business as usual reproduces Ferlyn’s own targets within 4%. No single assumption moves payback past 2028; with no advertising gain at all, the plan still returns S$0.7M over five years, payback 2029."],
 ["Where does the data come from?","Sanesh","The tills: about 50,000 purchases a month, by product, machine and minute — plus public data on each area."],
 ["Privacy?","Sanesh","Verified presence counts purchases, not faces. PIP Club is opt-in, and brands get campaign reports, not personal data."],
 ["Why would landlords trust a new scorecard?","Rizwan","Because they see their 10% in dollars before they sign and every month after. After recent operator collapses in Singapore, transparency is the selling point."],
 ["What if suppliers will not join?","Kartik","Launchpad lowers the risk: four weeks, 20 machines, S$1,500, and they keep ownership of the stock. Twenty-five of our 27 suppliers already stay."],
 ["How will competitors react?","Wee Khee","Others can copy screens; they cannot copy 670 tills and the data behind them. That is the moat."],
 ["Who builds and runs it?","Wee Khee","A core team of three to four, plus specialists, inside the 2027 budget of S$597k. Ferlyn decides go or no-go after 90 days."],
];
const WHO = ["All","Wee Khee","Rizwan","Sanesh","Kartik","Josephine","Q&A"];
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function fmt(txt){
  let h = esc(txt);
  h = h.replace(/\{\{(.+?)\}\}/g, '</p><div class="dir">$1</div><p>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\[&gt;\]/g, () => '<span class="clk">CLICK</span>');
  h = h.replace(/ \/ /g, ' <span class="pause">/</span> ');
  return ('<p>' + h + '</p>').replace(/<p>\s*<\/p>/g, '');
}
const store = { get(k,d){ try { const v = localStorage.getItem('pipnotes.'+k); return v==null?d:v; } catch(e){ return d; } }, set(k,v){ try { localStorage.setItem('pipnotes.'+k,v); } catch(e){} } };
let who = store.get('who','All'), fs = +store.get('fs',21), cur = +store.get('cur',0);
if (store.get('theme','dark') === 'light') document.body.classList.add('light');
document.documentElement.style.setProperty('--fs', fs+'px');
function render(){
  const m = document.getElementById('m'); let h = '', last = '';
  if (who !== 'Q&A') S.forEach((s,i) => {
    if (who !== 'All' && s.sp !== who) return;
    if (s.sp !== last) { const part = S.filter(x=>x.sp===s.sp); h += `<div class="sec"><span>${s.sp}</span><span>${s.at.split('–')[0]}</span></div>`; last = s.sp; }
    h += `<article class="card${i===cur?' cur':''}" id="c${i}" data-i="${i}"><div class="ch"><b>${s.n} · ${esc(s.t)}</b><span>${s.at}</span></div><div class="say">${fmt(s.say)}</div></article>`;
  });
  if (who === 'Q&A' || who === 'All') {
    h += `<div class="sec"><span>Q&amp;A routing</span><span>after 9:00</span></div><article class="card"><table class="qa">${QA.map(q=>`<tr><td>${esc(q[0])}<span class="own">${q[1]}</span></td><td>${esc(q[2])}</td></tr>`).join('')}</table><p class="never">No answer ready? “Good question — we have not modelled that; our first step would be …”, then one sentence. Never guess a number.</p></article>`;
  }
  m.innerHTML = h;
  document.getElementById('who').innerHTML = WHO.map(w=>`<button class="${w===who?'on':''}" data-w="${w}">${w}</button>`).join('');
  document.querySelectorAll('#who button').forEach(b=>b.onclick=()=>{ who=b.dataset.w; store.set('who',who); render(); if (who==='Q&A') window.scrollTo(0,0); else jump(firstFor()); });
  document.querySelectorAll('.card[data-i]').forEach(c=>c.onclick=()=>{ cur=+c.dataset.i; store.set('cur',cur); mark(); });
}
function firstFor(){ const i = S.findIndex(s=>who==='All'||s.sp===who); return i<0?0:i; }
function visible(){ return S.map((s,i)=>i).filter(i=>who==='All'||S[i].sp===who); }
function mark(){ document.querySelectorAll('.card').forEach(c=>c.classList.toggle('cur', +c.dataset.i===cur)); }
function jump(i){ if (who==='Q&A') return; cur=i; store.set('cur',cur); mark(); const el=document.getElementById('c'+i); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
document.getElementById('next').onclick=()=>{ const v=visible(); const k=v.indexOf(cur); jump(v[Math.min(v.length-1, k<0?0:k+1)]); };
document.getElementById('prev').onclick=()=>{ const v=visible(); const k=v.indexOf(cur); jump(v[Math.max(0, k<0?0:k-1)]); };
document.getElementById('fp').onclick=()=>{ fs=Math.min(34,fs+2); store.set('fs',fs); document.documentElement.style.setProperty('--fs',fs+'px'); };
document.getElementById('fm').onclick=()=>{ fs=Math.max(15,fs-2); store.set('fs',fs); document.documentElement.style.setProperty('--fs',fs+'px'); };
document.getElementById('theme').onclick=()=>{ document.body.classList.toggle('light'); store.set('theme', document.body.classList.contains('light')?'light':'dark'); };
// timer (target 9:00), keeps the screen awake while running where supported
let t0=null, acc=0, raf, lock=null;
const tg=540;
function tick(){ const s=Math.floor((acc+(t0?Date.now()-t0:0))/1000); const el=document.getElementById('t'); el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; el.className='timer'+(s>tg?' over':s>tg-60?' warn':''); raf=requestAnimationFrame(tick); }
document.getElementById('start').onclick=async e=>{ if(t0){ acc+=Date.now()-t0; t0=null; e.target.textContent='Start'; if(lock){lock.release();lock=null;} } else { t0=Date.now(); e.target.textContent='Pause'; try{ lock=await navigator.wakeLock.request('screen'); }catch(err){} } };
document.getElementById('reset').onclick=()=>{ t0=null; acc=0; document.getElementById('start').textContent='Start'; };
render(); tick(); setTimeout(()=>jump(visible().includes(cur)?cur:firstFor()), 50);
</script>
</body>
</html>
