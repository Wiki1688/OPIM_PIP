<!doctype html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Speaker notes · PIP AI Growth Engine</title>
<style>
@font-face { font-family: "Jakarta"; src: url("assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
:root { --pink:#D6007A; --rose:#F4A3CB; --teal:#1B7F8C; --bg:#14060f; --card:#22101c; --ink:#fff5fa; --muted:#c9b3c0; --fs:21px; }
body.light { --bg:#fdf3f8; --card:#ffffff; --ink:#2b2b2b; --muted:#6d6168; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Jakarta", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; border-bottom: 1px solid rgba(214,0,122,.35); }
.row { display: flex; gap: 8px; align-items: center; }
.timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 24px; min-width: 64px; }
header .row button { flex: none; } header .row { flex-wrap: nowrap; }
.timer.warn { color: #ffb54d; } .timer.over { color: #ff5c9b; }
.target { font-size: 12px; color: var(--muted); line-height: 1.2; }
button { font: inherit; border: 0; border-radius: 10px; background: #3a1730; color: #fff; padding: 9px 10px; font-weight: 700; font-size: 14px; }
body.light button { background: #f3dbe7; color: #2b2b2b; }
button.on, button.pink { background: var(--pink) !important; color: #fff !important; }
.sp { flex: 1; }
.who { display: flex; gap: 6px; overflow-x: auto; padding-top: 8px; scrollbar-width: none; }
.who::-webkit-scrollbar { display: none; }
.who button { white-space: nowrap; padding: 7px 12px; font-size: 13px; }
main { padding: 10px 12px calc(env(safe-area-inset-bottom) + 90px); }
.sec { margin: 18px 2px 8px; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--rose); display: flex; justify-content: space-between; }
body.light .sec { color: var(--pink); }
.card { background: var(--card); border-radius: 16px; padding: 14px 16px 16px; margin: 0 0 12px; border-left: 5px solid var(--pink); scroll-margin-top: 120px; }
.card.cur { outline: 2px solid var(--rose); }
.ch { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.ch b { font-size: 16px; } .ch span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.say { font-size: var(--fs); line-height: 1.5; }
.say strong { color: #ff8cc4; } body.light .say strong { color: var(--pink); }
.say p { margin: 0 0 .55em; }
.clk { display: inline-block; background: var(--pink); color: #fff; font-size: .62em; font-weight: 800; letter-spacing: .06em; padding: 2px 8px; border-radius: 6px; vertical-align: .2em; margin: 0 3px; }
.dir { font-size: 14px; color: var(--muted); font-style: italic; margin: 6px 0; }
.pause { color: var(--rose); font-weight: 800; padding: 0 2px; }
.never { font-size: 14px; color: var(--muted); }
.qa td { padding: 8px 6px; vertical-align: top; border-top: 1px solid rgba(255,255,255,.08); font-size: 15px; line-height: 1.4; }
.qa td:first-child { font-weight: 700; width: 38%; }
.qa .own { display: block; color: var(--rose); font-size: 12px; font-weight: 800; margin-top: 3px; }
footer { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px); background: linear-gradient(transparent, var(--bg) 30%); }
footer button { flex: 1; padding: 14px; font-size: 17px; }
@media print {
  @page { size: 90mm 160mm; margin: 6mm; }
  header, footer { display: none; } main { padding: 0; } body { background: #fff; color: #222; --fs: 16px; --muted:#666; --card:#fff; }
  .card { break-inside: avoid; border: 1px solid #eee; border-left: 4px solid var(--pink); } .say strong { color: var(--pink); }
}
</style>
</head>
<body>
<header>
  <div class="row">
    <div><div class="timer" id="t">0:00</div><div class="target" id="tg">target 9:00</div></div>
    <button class="pink" id="start">Start</button>
    <button id="reset">Reset</button>
    <span class="sp"></span>
    <button id="fm" aria-label="Smaller text">A−</button>
    <button id="fp" aria-label="Larger text">A+</button>
    <button id="theme" aria-label="Light or dark">◐</button>
  </div>
  <div class="who" id="who"></div>
</header>
<main id="m"></main>
<footer><button id="prev">◀ Prev</button><button class="pink" id="next">Next slide ▶</button></footer>

<script src="content/script.js?v=20261027c"></script>
<script>
/* Script and Q&A live in content/script.js, shared with the presenter view. */
const S = window.SCRIPT;
const QA = window.QA;
const WHO = ["All","Wee Khee","Rizwan","Sanesh","Kartik","Josephine","Q&A"];
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function fmt(txt){
  let h = esc(txt);
  h = h.replace(/\{\{(.+?)\}\}/g, '</p><div class="dir">$1</div><p>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\[&gt;\]/g, () => '<span class="clk">CLICK</span>');
  h = h.replace(/ \/ /g, ' <span class="pause">/</span> ');
  return ('<p>' + h + '</p>').replace(/<p>\s*<\/p>/g, '');
}
const store = { get(k,d){ try { const v = localStorage.getItem('pipnotes.'+k); return v==null?d:v; } catch(e){ return d; } }, set(k,v){ try { localStorage.setItem('pipnotes.'+k,v); } catch(e){} } };
let who = store.get('who','All'), fs = +store.get('fs',21), cur = +store.get('cur',0);
if (store.get('theme','dark') === 'light') document.body.classList.add('light');
document.documentElement.style.setProperty('--fs', fs+'px');
function render(){
  const m = document.getElementById('m'); let h = '', last = '';
  if (who !== 'Q&A') S.forEach((s,i) => {
    if (who !== 'All' && s.sp !== who) return;
    if (s.sp !== last) { const part = S.filter(x=>x.sp===s.sp); h += `<div class="sec"><span>${s.sp}</span><span>${s.at.split('–')[0]}</span></div>`; last = s.sp; }
    h += `<article class="card${i===cur?' cur':''}" id="c${i}" data-i="${i}"><div class="ch"><b>${s.n} · ${esc(s.t)}</b><span>${s.at}</span></div><div class="say">${fmt(s.say)}</div></article>`;
  });
  if (who === 'Q&A' || who === 'All') {
    h += `<div class="sec"><span>Q&amp;A routing</span><span>after 9:00</span></div><article class="card"><table class="qa">${QA.map(q=>`<tr><td>${esc(q[0])}<span class="own">${q[1]}</span></td><td>${esc(q[2])}</td></tr>`).join('')}</table><p class="never">No answer ready? “Good question — we have not modelled that; our first step would be …”, then one sentence. Never guess a number.</p></article>`;
  }
  m.innerHTML = h;
  document.getElementById('who').innerHTML = WHO.map(w=>`<button class="${w===who?'on':''}" data-w="${w}">${w}</button>`).join('');
  document.querySelectorAll('#who button').forEach(b=>b.onclick=()=>{ who=b.dataset.w; store.set('who',who); render(); if (who==='Q&A') window.scrollTo(0,0); else jump(firstFor()); });
  document.querySelectorAll('.card[data-i]').forEach(c=>c.onclick=()=>{ cur=+c.dataset.i; store.set('cur',cur); mark(); });
}
function firstFor(){ const i = S.findIndex(s=>who==='All'||s.sp===who); return i<0?0:i; }
function visible(){ return S.map((s,i)=>i).filter(i=>who==='All'||S[i].sp===who); }
function mark(){ document.querySelectorAll('.card').forEach(c=>c.classList.toggle('cur', +c.dataset.i===cur)); }
function jump(i){ if (who==='Q&A') return; cur=i; store.set('cur',cur); mark(); const el=document.getElementById('c'+i); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
document.getElementById('next').onclick=()=>{ const v=visible(); const k=v.indexOf(cur); jump(v[Math.min(v.length-1, k<0?0:k+1)]); };
document.getElementById('prev').onclick=()=>{ const v=visible(); const k=v.indexOf(cur); jump(v[Math.max(0, k<0?0:k-1)]); };
document.getElementById('fp').onclick=()=>{ fs=Math.min(34,fs+2); store.set('fs',fs); document.documentElement.style.setProperty('--fs',fs+'px'); };
document.getElementById('fm').onclick=()=>{ fs=Math.max(15,fs-2); store.set('fs',fs); document.documentElement.style.setProperty('--fs',fs+'px'); };
document.getElementById('theme').onclick=()=>{ document.body.classList.toggle('light'); store.set('theme', document.body.classList.contains('light')?'light':'dark'); };
// timer (target 9:00), keeps the screen awake while running where supported
let t0=null, acc=0, raf, lock=null;
const tg=540;
function tick(){ const s=Math.floor((acc+(t0?Date.now()-t0:0))/1000); const el=document.getElementById('t'); el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; el.className='timer'+(s>tg?' over':s>tg-60?' warn':''); raf=requestAnimationFrame(tick); }
document.getElementById('start').onclick=async e=>{ if(t0){ acc+=Date.now()-t0; t0=null; e.target.textContent='Start'; if(lock){lock.release();lock=null;} } else { t0=Date.now(); e.target.textContent='Pause'; try{ lock=await navigator.wakeLock.request('screen'); }catch(err){} } };
document.getElementById('reset').onclick=()=>{ t0=null; acc=0; document.getElementById('start').textContent='Start'; };
render(); tick(); setTimeout(()=>jump(visible().includes(cur)?cur:firstFor()), 50);
</script>
</body>
</html>
